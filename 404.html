<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | THE SIGMA GAMES</title>
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #121212;
            --accent-color: #00FF9D;
            --accent-glow: rgba(0, 255, 157, 0.4);
            --danger-color: #ff3366;
            --danger-glow: rgba(255, 51, 102, 0.4);
            --text-color: #ffffff;
            --subtext-color: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            max-width: 600px;
            background: var(--card-bg);
            border: 2px solid var(--danger-color);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 0 30px var(--danger-glow);
            position: relative;
        }

        .error-code {
            font-size: 7rem;
            font-weight: 900;
            color: var(--danger-color);
            text-shadow: 0 0 20px var(--danger-glow);
            letter-spacing: 6px;
            line-height: 1;
            margin-bottom: 10px;
            animation: pulse 2s infinite alternate;
        }

        .error-title {
            font-size: 1.8rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .error-desc {
            color: var(--subtext-color);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-block;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            border-radius: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .primary-btn {
            background: var(--accent-color);
            color: #000;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .primary-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px var(--accent-color);
            filter: brightness(1.1);
        }

        .secondary-btn {
            background: transparent;
            color: var(--text-color);
            border: 2px solid #333;
        }

        .secondary-btn:hover {
            border-color: var(--text-color);
            transform: translateY(-3px);
        }

        .countdown {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--subtext-color);
        }

        .countdown span {
            color: var(--accent-color);
            font-weight: bold;
        }

        @keyframes pulse {
            0% {
                text-shadow: 0 0 15px var(--danger-glow);
            }
            100% {
                text-shadow: 0 0 35px var(--danger-color);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">HATA - SAYFA BULUNAMADI</h1>
        <p class="error-desc">
            Aradığınız bölüm, harita veya sayfa silinmiş ya da hiç var olmamış olabilir. Sigma arenasına geri dönüp oyun oynamaya devam et!
        </p>

        <div class="btn-group">
            <a href="index.html" class="action-btn primary-btn">🎮 Ana Menüye Dön</a>
            <button onclick="history.back()" class="action-btn secondary-btn">↩ Geri Git</button>
        </div>

        <div class="countdown">
            <span id="timer">10</span> saniye içinde otomatik olarak ana sayfaya yönlendirileceksiniz.
        </div>
    </div>

    <script>
        // 10 Saniye Sonra Otomatik Ana Sayfaya Yönlendirme
        let seconds = 10;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            seconds--;
            timerElement.innerText = seconds;

            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>
</html>
