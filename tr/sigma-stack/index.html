<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sigma Stack</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060c; font-family: system-ui, sans-serif; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  #hud { position: fixed; top: 14px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
  #score { font-size: 56px; font-weight: 800; text-shadow: 0 6px 24px rgba(0,0,0,0.8); color: #00d4ff; }
  #best { opacity: .75; font-size: 14px; margin-top: 2px; }
  #back { position: fixed; top: 16px; left: 14px; z-index: 3; color: #fff; text-decoration: none; opacity: .8; font-weight: 700; font-size: 14px; }
  #back:hover { opacity: 1; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,4,10,.85); text-align: center; padding: 24px; z-index: 4; }
  #overlay.hide { display: none; }
  h1 { font-size: clamp(32px, 8vw, 52px); margin: 0 0 8px; letter-spacing: 3px; background: linear-gradient(90deg, #00d4ff, #ff3cac); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { opacity: .8; margin: 0 0 22px; line-height: 1.5; font-size: 16px; }
  button { border: 0; border-radius: 14px; padding: 14px 36px; font-size: 18px; font-weight: 800; cursor: pointer; background: linear-gradient(90deg, #00d4ff, #ff3cac); color: #fff; box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4); transition: transform 0.1s; }
  button:active { transform: scale(0.95); }
</style>
</head>
<body>
  <a id="back" href="../">← Menü</a>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="score">0</div>
    <div id="best"></div>
  </div>
  <div id="overlay">
    <h1>SIGMA STACK</h1>
    <p class="sub">Ekrana Dokun / Blokları Tam Zamanında Durdur<br>Kuleyi gökyüzüne kadar yükselt!</p>
    <button id="go">BAŞLA</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const goBtn = document.getElementById("go");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");

  const SAVE_KEY = "sigma-stack-best";
  const GW = 400, GH = 640;
  const BLOCK_H = 26;
  const PALETTE = ["#00d4ff", "#ff3cac", "#ffe14d", "#5dff8a", "#ff8a3c", "#b794ff"];

  let W = 0, H = 0, scale = 1, offsetX = 0, offsetY = 0;
  let state = "menu"; // "menu", "play", "dead"
  let score = 0, best = 0;

  let stack = [];
  let currentBlock = null;
  let fallingDebris = [];
  let particles = [];
  let cameraY = 0;
  let targetCameraY = 0;

  let combo = 0;
  let speed = 3.5;
  let flash = 0, ac = null;

  try { best = parseInt(localStorage.getItem(SAVE_KEY) || "0", 10) || 0; } catch (e) {}
  bestEl.textContent = best ? ("Rekor: " + best) : "";

  function resize() {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";

    const scaleX = W / GW;
    const scaleY = H / GH;
    scale = Math.min(scaleX, scaleY);
    offsetX = (W - GW * scale) / 2;
    offsetY = (H - GH * scale) / 2;

    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offsetX, dpr * offsetY);
  }
  addEventListener("resize", resize);
  resize();

  function sound(freq, type = "sine", duration = 0.05, vol = 0.04) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g); g.connect(ac.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration);
      o.stop(ac.currentTime + duration);
    } catch (e) {}
  }

  function getColor(index) {
    return PALETTE[index % PALETTE.length];
  }

  function initGame() {
    state = "play";
    score = 0;
    combo = 0;
    speed = 3.5;
    cameraY = 0;
    targetCameraY = 0;
    fallingDebris = [];
    particles = [];
    flash = 0;

    // Taban Bloğu
    const baseWidth = 220;
    stack = [{
      x: (GW - baseWidth) / 2,
      y: GH - 140,
      w: baseWidth,
      color: getColor(0)
    }];

    spawnNextBlock();

    scoreEl.textContent = "0";
    overlay.classList.add("hide");
    sound(520, "sine", 0.1, 0.06);
  }

  function spawnNextBlock() {
    const prev = stack[stack.length - 1];
    const level = stack.length;
    const dir = level % 2 === 0 ? 1 : -1;
    const startX = dir === 1 ? -prev.w : GW;

    currentBlock = {
      x: startX,
      y: prev.y - BLOCK_H,
      w: prev.w,
      dir: dir,
      speed: Math.min(7.5, speed + level * 0.05),
      color: getColor(level)
    };

    // Kamera yüksekliğini güncelle
    if (stack.length > 8) {
      targetCameraY = (stack.length - 8) * BLOCK_H;
    }
  }

  function placeBlock() {
    if (state !== "play" || !currentBlock) return;

    const prev = stack[stack.length - 1];
    const diff = currentBlock.x - prev.x;
    const absDiff = Math.abs(diff);

    // Mükemmel Yerleştirme Toleransı (Combo)
    if (absDiff < 4) {
      currentBlock.x = prev.x;
      combo++;
      
      // Her 5 mükemmel üst üste koymada blok hafifçe büyür
      if (combo >= 5) {
        currentBlock.w = Math.min(260, currentBlock.w + 12);
        currentBlock.x = Math.max(10, currentBlock.x - 6);
      }

      sound(400 + combo * 60, "triangle", 0.08, 0.06);

      // Parlama Efekti Parçacıkları
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: currentBlock.x + Math.random() * currentBlock.w,
          y: currentBlock.y + BLOCK_H / 2,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 4 - 2,
          life: 0.9,
          color: "#fff"
        });
      }
    } else {
      combo = 0;
      const newWidth = prev.w - absDiff;

      if (newWidth <= 0) {
        // Tamamen Kaçırdı -> Oyun Bitti
        fallingDebris.push({
          x: currentBlock.x,
          y: currentBlock.y,
          w: currentBlock.w,
          vy: 0,
          vx: currentBlock.dir * 3,
          color: currentBlock.color
        });
        die();
        return;
      }

      // Parçalanan Kesiti Hesapla
      let debrisX, debrisW;
      if (diff > 0) {
        // Sağdan Taşan Parça
        currentBlock.w = newWidth;
        debrisX = currentBlock.x + newWidth;
        debrisW = absDiff;
      } else {
        // Soldan Taşan Parça
        debrisX = currentBlock.x;
        debrisW = absDiff;
        currentBlock.x = prev.x;
        currentBlock.w = newWidth;
      }

      // Düşen Parçayı Ekle
      fallingDebris.push({
        x: debrisX,
        y: currentBlock.y,
        w: debrisW,
        vy: 0,
        vx: (diff > 0 ? 1 : -1) * 2,
        color: currentBlock.color
      });

      sound(260 + stack.length * 10, "sine", 0.05, 0.04);
    }

    stack.push({
      x: currentBlock.x,
      y: currentBlock.y,
      w: currentBlock.w,
      color: currentBlock.color
    });

    score++;
    scoreEl.textContent = String(score);
    spawnNextBlock();
  }

  function die() {
    state = "dead";
    currentBlock = null;
    flash = 1;
    sound(120, "sawtooth", 0.3, 0.08);

    if (score > best) {
      best = score;
      try { localStorage.setItem(SAVE_KEY, String(best)); } catch (e) {}
    }
    bestEl.textContent = "Rekor: " + best;

    overlay.innerHTML = `<h1>OYUN BİTTİ</h1><p class='sub'>Yükseklik: ${score}${score >= best && score > 0 ? "<br>Yeni Rekor!" : ""}</p><button id='go2'>TEKRAR DENE</button>`;
    overlay.classList.remove("hide");
    document.getElementById("go2").onclick = initGame;
  }

  function update() {
    // Kamera Yumuşatması
    cameraY += (targetCameraY - cameraY) * 0.1;

    // Flaş Efekti
    if (flash > 0) flash -= 0.04;

    // Düşen Parçalar
    fallingDebris.forEach(d => {
      d.vy += 0.4;
      d.y += d.vy;
      d.x += d.vx;
    });
    fallingDebris = fallingDebris.filter(d => d.y < GH + cameraY + 100);

    // Parçacıklar
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.life -= 0.03;
    });
    particles = particles.filter(p => p.life > 0);

    // Hareketli Blok
    if (state === "play" && currentBlock) {
      currentBlock.x += currentBlock.dir * currentBlock.speed;

      // Duvarlardan Sektirme
      if (currentBlock.dir === 1 && currentBlock.x + currentBlock.w >= GW + 40) {
        currentBlock.dir = -1;
      } else if (currentBlock.dir === -1 && currentBlock.x <= -40) {
        currentBlock.dir = 1;
      }
    }
  }

  function draw() {
    // Arka Plan
    const bg = ctx.createLinearGradient(0, 0, 0, GH);
    bg.addColorStop(0, "#120a2a");
    bg.addColorStop(1, "#05040a");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, GW, GH);

    ctx.save();
    ctx.translate(0, cameraY);

    // Izgara Arka Plan Çizgileri
    ctx.strokeStyle = "rgba(0, 212, 255, 0.03)";
    ctx.lineWidth = 1;
    for (let y = 0; y < GH + cameraY; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GW, y); ctx.stroke();
    }

    // Üst Üste Yerleşmiş Bloklar
    stack.forEach((b, i) => {
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = i === stack.length - 1 ? 12 : 4;
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, BLOCK_H - 2, 6);
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Hareket Eden Blok
    if (state === "play" && currentBlock) {
      ctx.fillStyle = currentBlock.color;
      ctx.shadowColor = currentBlock.color;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.roundRect(currentBlock.x, currentBlock.y, currentBlock.w, BLOCK_H - 2, 6);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Düşen Parçalar
    fallingDebris.forEach(d => {
      ctx.fillStyle = d.color;
      ctx.beginPath();
      ctx.roundRect(d.x, d.y, d.w, BLOCK_H - 2, 4);
      ctx.fill();
    });

    // Parçacıklar
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.5, 3 * p.life), 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    });

    ctx.restore();

    // Flaş Efekti
    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 60, 172, ${Math.min(0.8, flash)})`;
      ctx.fillRect(0, 0, GW, GH);
    }
  }

  function handleAction(e) {
    if (e.target.tagName === "BUTTON" || e.target.tagName === "A") return;
    if (state === "play") placeBlock();
  }

  window.addEventListener("mousedown", handleAction);
  window.addEventListener("touchstart", handleAction, { passive: true });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      handleAction(e);
    }
  });

  goBtn.onclick = initGame;

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
