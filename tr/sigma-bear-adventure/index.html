<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigma Bear Adventure - The Sigma Games</title>
  <style>
    /* --- GENEL AYARLAR VE SİGMABEAR ARKAPLANI --- */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    
    body { 
      background: radial-gradient(circle at center, #2b1055 0%, #130727 100%); 
      color: #fff; 
      overflow: hidden; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
    }

    /* --- UÇUŞAN NEON PARTİKÜLLER İÇİN KANVAS STİLİ --- */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0; 
    }
    
    .screen { 
      position: absolute; width: 100%; height: 100%; 
      display: flex; flex-direction: column; justify-content: center; align-items: center; 
      transition: opacity 0.4s ease; 
      z-index: 2; /* Menü ve oyun ekranlarının kanvasın önünde durması için */
    }
    
    /* KARA EKRAN HATASINI ÇÖZEN HIDE SINIFI */
    .hide { display: none !important; opacity: 0; pointer-events: none; }

    /* --- MENÜ TASARIMI --- */
    .menu-container {
      background: rgba(255, 255, 255, 0.08);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.4);
      text-align: center;
      width: 350px;
    }
    
    h1 { font-size: 2.8rem; margin-bottom: 25px; color: #00e5ff; text-shadow: 0 0 15px #00e5ff; }
    
    .btn-main { 
      width: 100%; padding: 15px; margin-bottom: 15px; 
      background: linear-gradient(90deg, #8a2be2, #4a00e0); 
      border: none; border-radius: 12px; color: #fff; 
      font-size: 1.2rem; font-weight: bold; cursor: pointer; 
      transition: transform 0.2s, box-shadow 0.2s; 
    }
    .btn-main:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(138, 43, 226, 0.6); }

    /* --- OYUN İÇİ ARAYÜZ (HUD) & BUTONLAR --- */
    #hud { 
      position: absolute; top: 0; left: 0; width: 100%; 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 20px 40px; z-index: 10; 
    }
    .hud-controls { display: flex; gap: 15px; }
    
    .btn-hud { 
      background: rgba(0, 0, 0, 0.5); border: 2px solid #00e5ff; color: #00e5ff; 
      padding: 10px 20px; border-radius: 8px; cursor: pointer; 
      font-weight: bold; transition: all 0.2s; 
    }
    .btn-hud:hover { background: #00e5ff; color: #000; }
    .btn-hud.paused { background: #ff0055; border-color: #ff0055; color: #fff; }

    .score-board { font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
    .score-board span { color: #00e5ff; }
    .p2-text { color: #ff0055 !important; text-shadow: 0 0 10px #ff0055 !important; }

    /* --- OYUN ALANI --- */
    .game-canvas { 
      width: 900px; height: 500px; 
      background: rgba(0, 0, 0, 0.6); 
      border-radius: 15px; border: 2px solid rgba(138, 43, 226, 0.5); 
      display: flex; justify-content: center; align-items: center; 
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <!-- UÇUŞAN NEON PARTİKÜLLER İÇİN KANVAS -->
  <canvas id="bg-canvas"></canvas>

  <!-- MENÜ EKRANI -->
  <div id="menu-screen" class="screen">
    <div class="menu-container">
      <h1 id="menu-title">SIGMA BEAR</h1>
      <button class="btn-main" id="btn-play-1p">1P Oyna</button>
      <button class="btn-main" id="btn-play-2p">2P Oyna</button>
    </div>
  </div>

  <!-- LOADER (Yükleme Ekranı - Kara ekranı engelleyen geçiş) -->
  <div id="loader-screen" class="screen hide" style="background: #000; z-index: 999;">
    <h2 style="color: #00e5ff; font-size: 2rem;">OYUN YÜKLENİYOR...</h2>
  </div>

  <!-- 1P OYUN EKRANI -->
  <div id="game-1p-screen" class="screen hide">
    <div id="hud">
      <div class="hud-controls">
        <button class="btn-hud" id="btn-pause-1p">⏸ Duraklat</button>
        <button class="btn-hud" id="btn-music-1p">🎵 Müzik: AÇIK</button>
        <button class="btn-hud" id="btn-sound-1p">🔊 Ses: AÇIK</button>
      </div>
      <div class="score-board">1P SKOR: <span id="score-1p">0</span></div>
    </div>
    <div class="game-canvas">
      <h2>(1P Oyun Motoru Buraya Gelecek)</h2>
    </div>
  </div>

  <!-- 2P OYUN EKRANI (MAVİ AYI) -->
  <div id="game-2p-screen" class="screen hide">
    <div id="hud">
      <div class="hud-controls">
        <button class="btn-hud" id="btn-pause-2p">⏸ Duraklat</button>
        <button class="btn-hud" id="btn-music-2p">🎵 Müzik: AÇIK</button>
        <button class="btn-hud" id="btn-sound-2p">🔊 Ses: AÇIK</button>
      </div>
      <div class="score-board">
        1P: <span id="p1-score">0</span> &nbsp;|&nbsp; P2: <span id="p2-score" class="p2-text">0</span>
      </div>
    </div>
    <div class="game-canvas">
      <h2>(2P Kapışma Motoru Buraya Gelecek)</h2>
    </div>
  </div>

  <script>
    (function() {
      // --- NEON PARTİKÜL SİSTEMİ ---
      const bgCanvas = document.getElementById("bg-canvas");
      const ctx = bgCanvas.getContext("2d");

      function resizeCanvas() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      const particles = [];
      const particleCount = 45; // Partikül sayısı

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height,
          radius: Math.random() * 2.5 + 1,
          color: Math.random() > 0.5 ? "#00e5ff" : "#8a2be2",
          speedX: (Math.random() - 0.5) * 0.6,
          speedY: (Math.random() - 0.5) * 0.6 - 0.3,
          alpha: Math.random() * 0.7 + 0.3
        });
      }

      function animateParticles() {
        ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        
        particles.forEach(p => {
          p.x += p.speedX;
          p.y += p.speedY;

          // Ekrandan çıkınca geri sok
          if (p.x < 0) p.x = bgCanvas.width;
          if (p.x > bgCanvas.width) p.x = 0;
          if (p.y < 0) p.y = bgCanvas.height;
          if (p.y > bgCanvas.height) p.y = 0;

          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 12;
          ctx.shadowColor = p.color;
          ctx.fill();
          ctx.restore();
        });

        requestAnimationFrame(animateParticles);
      }
      animateParticles(); // Animasyonu başlat


      // --- OYUN DEĞİŞKENLERİ ---
      let currentMode = "1p";
      let isPaused = false;
      let musicOn = true;
      let soundOn = true;

      // DOM Elementleri
      const menuScreen = document.getElementById("menu-screen");
      const loaderScreen = document.getElementById("loader-screen");
      const game1pScreen = document.getElementById("game-1p-screen");
      const game2pScreen = document.getElementById("game-2p-screen");

      // --- SES VE MÜZİK KONTROLLERİ ---
      const menuMusic = new Audio(); // Oyun tamamlanınca src eklenecek
      const gameMusic = new Audio();
      menuMusic.loop = true;
      gameMusic.loop = true;

      function playMenuMusic() {
        if (!musicOn) return;
        gameMusic.pause();
        console.log("🎵 Menü Müziği Çalıyor...");
      }

      function playGameMusic() {
        if (!musicOn) return;
        menuMusic.pause();
        console.log("🎵 Oyun Müziği Çalıyor...");
      }

      function playSfx(type) {
        if (!soundOn) return;
        console.log("🔊 Ses efekti oynatıldı: " + type);
      }

      // --- EKRAN GEÇİŞİ (KARA EKRAN HATASI ÇÖZÜMÜ) ---
      function transitionToGame(mode) {
        currentMode = mode;
        playSfx("click");
        
        // Önce menüyü sakla ve loader ekranını göster
        menuScreen.classList.add("hide");
        loaderScreen.classList.remove("hide");

        // 1 saniye bekle, sonra oyuna geçiş yap
        setTimeout(() => {
          loaderScreen.classList.add("hide");
          playGameMusic();

          if (mode === "1p") {
            document.getElementById("score-1p").textContent = "0";
            game1pScreen.classList.remove("hide");
          } else if (mode === "2p") {
            document.getElementById("p1-score").textContent = "0";
            document.getElementById("p2-score").textContent = "0";
            game2pScreen.classList.remove("hide");
          }
          isPaused = false;
        }, 1000);
      }

      // --- MENÜ BUTONLARI ---
      document.getElementById("btn-play-1p").onclick = () => transitionToGame("1p");
      document.getElementById("btn-play-2p").onclick = () => transitionToGame("2p");

      // --- DURAKLATMA (PAUSE) BUTONLARI ---
      function togglePause(btnElement) {
        isPaused = !isPaused;
        playSfx("click");
        if (isPaused) {
          btnElement.textContent = "▶ Devam Et";
          btnElement.classList.add("paused");
          console.log("⏸ Oyun Duraklatıldı");
        } else {
          btnElement.textContent = "⏸ Duraklat";
          btnElement.classList.remove("paused");
          console.log("▶ Oyun Devam Ediyor");
        }
      }
      document.getElementById("btn-pause-1p").onclick = function() { togglePause(this); };
      document.getElementById("btn-pause-2p").onclick = function() { togglePause(this); };

      // --- MÜZİK VE SES KONTROLLERİ BUTONLARI ---
      function toggleMusic(btn1, btn2) {
        musicOn = !musicOn;
        const text = musicOn ? "🎵 Müzik: AÇIK" : "🔇 Müzik: KAPALI";
        btn1.textContent = text;
        btn2.textContent = text;
        
        if (!musicOn) {
          menuMusic.pause();
          gameMusic.pause();
        } else {
          // Eğer menü görünürse menü müziğini, değilse oyun müziğini çal
          if (!menuScreen.classList.contains("hide")) playMenuMusic();
          else playGameMusic();
        }
      }

      function toggleSound(btn1, btn2) {
        soundOn = !soundOn;
        const text = soundOn ? "🔊 Ses: AÇIK" : "🔇 Ses: KAPALI";
        btn1.textContent = text;
        btn2.textContent = text;
        playSfx("click");
      }

      const btnMusic1 = document.getElementById("btn-music-1p");
      const btnMusic2 = document.getElementById("btn-music-2p");
      const btnSound1 = document.getElementById("btn-sound-1p");
      const btnSound2 = document.getElementById("btn-sound-2p");

      btnMusic1.onclick = () => toggleMusic(btnMusic1, btnMusic2);
      btnMusic2.onclick = () => toggleMusic(btnMusic1, btnMusic2);
      btnSound1.onclick = () => toggleSound(btnSound1, btnSound2);
      btnSound2.onclick = () => toggleSound(btnSound1, btnSound2);

      // Oyun yüklendiğinde menü müziğini başlat
      playMenuMusic();
    })();
  </script>
</body>
</html>
