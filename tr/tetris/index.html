<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGMA TETRIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚡ SIGMA TETRIS ⚡</h1>
        
        <div class="game-info">
            <p>← → - Hareket</p>
            <p>↑ - Döndür</p>
            <p>↓ - Hızlı Düşür</p>
            <p>SPACE - Duraklat</p>
        </div>
        
        <div class="game-wrapper">
            <div class="main-game">
                <canvas id="tetrisCanvas" width="200" height="400"></canvas>
            </div>
            <div class="game-stats">
                <div class="stat">
                    <div class="stat-label">PUAN</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">SEVİYE</div>
                    <div class="stat-value" id="level">1</div>
                </div>
                <div class="stat">
                    <div class="stat-label">SATIR</div>
                    <div class="stat-value" id="lines">0</div>
                </div>
            </div>
        </div>
        
        <button id="startBtn" class="btn">OYUNU BAŞLAT</button>
        <button id="resetBtn" class="btn">SIFIRLA</button>
        
        <br><br>
        <a href="../../" class="back-link">← Geri Dön</a>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
