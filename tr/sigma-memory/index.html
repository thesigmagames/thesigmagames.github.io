<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGMA MEMORY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚡ SIGMA MEMORY ⚡</h1>
        
        <div class="game-info">
            <p>Eşleşen kartları bul!</p>
            <p>Tüm kartları eşleştir ve kazanışsın!</p>
        </div>
        
        <div id="gameBoard" class="game-board"></div>
        
        <div class="score-board">
            <div class="score">Hamle: <span id="moves">0</span></div>
            <div class="score">Eşleşme: <span id="matches">0/8</span></div>
        </div>
        
        <button id="startBtn" class="btn">YENİ OYUN</button>
        <button id="resetBtn" class="btn">SIFIRLA</button>
        
        <br><br>
        <a href="../../" class="back-link">← Geri Dön</a>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
