<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sigma Helix Tower</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060c; font-family: system-ui, sans-serif; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; top: 14px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
  #score { font-size: 56px; font-weight: 800; text-shadow: 0 6px 24px rgba(0,0,0,0.8); color: #00d4ff; }
  #best { opacity: .75; font-size: 14px; margin-top: 2px; }
  #back { position: fixed; top: 16px; left: 14px; z-index: 3; color: #fff; text-decoration: none; opacity: .8; font-weight: 700; font-size: 14px; }
  #back:hover { opacity: 1; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,4,10,.85); text-align: center; padding: 24px; z-index: 4; }
  #overlay.hide { display: none; }
  h1 { font-size: clamp(32px, 8vw, 52px); margin: 0 0 8px; letter-spacing: 3px; background: linear-gradient(90deg, #00d4ff, #ff3cac); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { opacity: .8; margin: 0 0 22px; line-height: 1.5; font-size: 16px; }
  button { border: 0; border-radius: 14px; padding: 14px 36px; font-size: 18px; font-weight: 800; cursor: pointer; background: linear-gradient(90deg, #00d4ff, #ff3cac); color: #fff; box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4); transition: transform 0.1s; }
  button:active { transform: scale(0.95); }
</style>
</head>
<body>
  <a id="back" href="../">← Menü</a>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="score">0</div>
    <div id="best"></div>
  </div>
  <div id="overlay">
    <h1>SIGMA HELIX TOWER</h1>
    <p class="sub">Sürükle veya Yön Tuşları<br>Kuleyi döndür, kırmızı alanlardan kaçarak aşağı in!</p>
    <button id="go">BAŞLA</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const goBtn = document.getElementById("go");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");

  const SAVE_KEY = "sigma-helix-best";
  const GW = 400, GH = 640;
  
  let W = 0, H = 0, scale = 1, offsetX = 0, offsetY = 0;
  let state = "menu";
  let score = 0, best = 0;

  let towerAngle = 0;
  let ballY = 160;
  let ballVy = 0;
  let ballRad = 12;
  let currentFloor = 0;

  let floors = [];
  const FLOOR_GAP = 120;
  const TOWER_R = 120;

  let particles = [];
  let flash = 0, ac = null;
  let isDragging = false, lastMouseX = 0;

  try { best = parseInt(localStorage.getItem(SAVE_KEY) || "0", 10) || 0; } catch (e) {}
  bestEl.textContent = best ? ("Rekor: " + best) : "";

  function resize() {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";

    scale = Math.min(W / GW, H / GH);
    offsetX = (W - GW * scale) / 2;
    offsetY = (H - GH * scale) / 2;

    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offsetX, dpr * offsetY);
  }
  addEventListener("resize", resize);
  resize();

  function sound(freq, type = "sine", duration = 0.05, vol = 0.04) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g); g.connect(ac.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration);
      o.stop(ac.currentTime + duration);
    } catch (e) {}
  }

  function generateFloor(yIndex) {
    const segments = 8;
    const gapCount = Math.min(3, 1 + Math.floor(yIndex / 10));
    const trapCount = Math.min(3, Math.floor(yIndex / 5));

    let types = new Array(segments).fill("safe");
    
    // Boşluklar
    let gapsPlaced = 0;
    while(gapsPlaced < gapCount) {
      let idx = Math.floor(Math.random() * segments);
      if(types[idx] === "safe") { types[idx] = "gap"; gapsPlaced++; }
    }

    // Tuzaklar
    let trapsPlaced = 0;
    while(trapsPlaced < trapCount) {
      let idx = Math.floor(Math.random() * segments);
      if(types[idx] === "safe") { types[idx] = "trap"; trapsPlaced++; }
    }

    return { y: yIndex * FLOOR_GAP + 280, types, passed: false };
  }

  function initGame() {
    state = "play";
    score = 0;
    towerAngle = 0;
    ballY = 200;
    ballVy = 0;
    currentFloor = 0;
    particles = [];
    flash = 0;

    floors = [];
    for (let i = 0; i < 15; i++) {
      floors.push(generateFloor(i));
    }

    scoreEl.textContent = "0";
    overlay.classList.add("hide");
    sound(520, "sine", 0.1, 0.06);
  }

  function die() {
    state = "dead";
    flash = 1;
    sound(110, "sawtooth", 0.3, 0.08);

    if (score > best) {
      best = score;
      try { localStorage.setItem(SAVE_KEY, String(best)); } catch (e) {}
    }
    bestEl.textContent = "Rekor: " + best;

    overlay.innerHTML = `<h1>OYUN BİTTİ</h1><p class='sub'>Kat: ${score}${score >= best && score > 0 ? "<br>Yeni Rekor!" : ""}</p><button id='go2'>TEKRAR DENE</button>`;
    overlay.classList.remove("hide");
    document.getElementById("go2").onclick = initGame;
  }

  function update() {
    if (flash > 0) flash -= 0.04;

    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.life -= 0.03;
    });
    particles = particles.filter(p => p.life > 0);

    if (state !== "play") return;

    // Yerçekimi
    ballVy += 0.45;
    ballY += ballVy;

    // Kamera Takibi
    const targetCamY = ballY - 200;

    // Katlarla Çarpışma Kontrolü
    floors.forEach((f) => {
      if (!f.passed && ballY >= f.y - ballRad && ballY - ballVy <= f.y) {
        // Hangi dilimin üstündeyiz?
        let normAngle = ((-towerAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        let segIdx = Math.floor((normAngle / (Math.PI * 2)) * 8) % 8;
        let type = f.types[segIdx];

        if (type === "safe") {
          ballY = f.y - ballRad;
          ballVy = -9.5; // Bouncing
          sound(450, "sine", 0.04, 0.05);

          for (let i = 0; i < 6; i++) {
            particles.push({
              x: GW / 2, y: ballY + 10,
              vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 3,
              life: 0.6, color: "#00d4ff"
            });
          }
        } else if (type === "trap") {
          die();
        } else if (type === "gap") {
          // Boşluktan geçti
        }
      }

      if (!f.passed && ballY > f.y + 20) {
        f.passed = true;
        score++;
        scoreEl.textContent = String(score);
        sound(750, "triangle", 0.06, 0.05);
      }
    });

    // Yeni Kat Üretimi
    if (floors[floors.length - 1].y - ballY < GH) {
      floors.push(generateFloor(floors.length));
    }
  }

  function draw() {
    const bg = ctx.createLinearGradient(0, 0, 0, GH);
    bg.addColorStop(0, "#120a2a"); bg.addColorStop(1, "#05040a");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, GW, GH);

    ctx.save();
    const camY = ballY - 200;
    ctx.translate(0, -camY);

    // Kule Ana Direği
    ctx.fillStyle = "#16132b";
    ctx.fillRect(GW / 2 - 25, camY - 100, 50, GH + 300);

    // Katlar
    floors.forEach(f => {
      if (f.y < camY - 100 || f.y > camY + GH + 100) return;

      const segAngle = (Math.PI * 2) / 8;
      for (let i = 0; i < 8; i++) {
        let type = f.types[i];
        if (type === "gap") continue;

        let startA = towerAngle + i * segAngle;
        let endA = startA + segAngle;

        ctx.beginPath();
        ctx.arc(GW / 2, f.y, TOWER_R, startA, endA);
        ctx.lineWidth = 14;
        ctx.strokeStyle = (type === "trap") ? "#ff3cac" : "#00d4ff";
        ctx.shadowColor = (type === "trap") ? "#ff3cac" : "#00d4ff";
        ctx.shadowBlur = 8;
        ctx.stroke();
      }
    });

    // Top
    ctx.beginPath();
    ctx.arc(GW / 2, ballY, ballRad, 0, Math.PI * 2);
    ctx.fillStyle = "#ffe14d";
    ctx.shadowColor = "#ffe14d";
    ctx.shadowBlur = 12;
    ctx.fill();

    // Parçacıklar
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    });

    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 60, 172, ${Math.min(0.8, flash)})`;
      ctx.fillRect(0, 0, GW, GH);
    }
  }

  // Kontroller
  function rotateTower(dx) {
    if (state === "play") {
      towerAngle += dx * 0.012;
    }
  }

  window.addEventListener("pointerdown", e => { isDragging = true; lastMouseX = e.clientX; });
  window.addEventListener("pointermove", e => {
    if (isDragging) {
      rotateTower(e.clientX - lastMouseX);
      lastMouseX = e.clientX;
    }
  });
  window.addEventListener("pointerup", () => isDragging = false);

  window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") rotateTower(-20);
    if (e.key === "ArrowRight") rotateTower(20);
  });

  goBtn.onclick = initGame;

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
