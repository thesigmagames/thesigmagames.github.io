<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sigma Helix Tower 3D</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060c; font-family: system-ui, sans-serif; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; top: 16px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
  #score { font-size: 60px; font-weight: 900; text-shadow: 0 8px 28px rgba(0,0,0,0.8); color: #00d4ff; font-family: monospace; }
  #best { opacity: .8; font-size: 15px; margin-top: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  #back { position: fixed; top: 16px; left: 16px; z-index: 3; color: #fff; text-decoration: none; opacity: .8; font-weight: 700; font-size: 14px; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 10px; backdrop-filter: blur(8px); }
  #back:hover { opacity: 1; background: rgba(255,255,255,0.2); }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,4,10,.88); text-align: center; padding: 24px; z-index: 4; backdrop-filter: blur(10px); }
  #overlay.hide { display: none; }
  h1 { font-size: clamp(32px, 7vw, 54px); margin: 0 0 10px; letter-spacing: 2px; background: linear-gradient(90deg, #00d4ff, #ff3cac); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
  .sub { opacity: .85; margin: 0 0 26px; line-height: 1.6; font-size: 16px; max-width: 380px; }
  button { border: 0; border-radius: 16px; padding: 16px 42px; font-size: 19px; font-weight: 800; cursor: pointer; background: linear-gradient(90deg, #00d4ff, #ff3cac); color: #fff; box-shadow: 0 6px 25px rgba(0, 212, 255, 0.4); transition: transform 0.15s, box-shadow 0.15s; }
  button:hover { transform: scale(1.03); box-shadow: 0 8px 30px rgba(0, 212, 255, 0.6); }
  button:active { transform: scale(0.96); }
</style>
<!-- 3D WebGL Motoru (Three.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <a id="back" href="../">← Menü</a>
  <div id="hud">
    <div id="score">0</div>
    <div id="best"></div>
  </div>
  <div id="overlay">
    <h1>SIGMA HELIX TOWER 3D</h1>
    <p class="sub">Ekranı Sürükle veya Yön Tuşlarını Kullan<br>Kuleyi döndür, kırmızılara çarpmadan boşluklardan aşağı süzül!</p>
    <button id="go">BAŞLA</button>
  </div>

<script>
(() => {
  const overlay = document.getElementById("overlay");
  const goBtn = document.getElementById("go");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");

  const SAVE_KEY = "sigma-helix-3d-best";
  const INNER_R = 1.8, OUTER_R = 6.2, FLOOR_GAP = 9.5;
  const SECTORS = 8;

  let state = "menu"; // "menu", "play", "dead"
  let score = 0, best = 0;
  
  let scene, camera, renderer, towerGroup, ball, ballLight;
  let ballY = 0, ballVy = 0;
  let floors = [];
  let particles = [];
  let ac = null;

  let isDragging = false, lastX = 0;

  try { best = parseInt(localStorage.getItem(SAVE_KEY) || "0", 10) || 0; } catch (e) {}
  bestEl.textContent = best ? ("REKOR: " + best) : "";

  function sound(freq, type = "sine", duration = 0.06, vol = 0.05) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g); g.connect(ac.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration);
      o.stop(ac.currentTime + duration);
    } catch (e) {}
  }

  // 3D Sahne Kurulumu
  function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07060c);
    scene.fog = new THREE.FogExp2(0x07060c, 0.015);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Işıklandırma
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 10;
    dirLight.shadow.camera.far = 100;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;
    scene.add(dirLight);

    // Ana Kule Grubu
    towerGroup = new THREE.Group();
    scene.add(towerGroup);

    // Orta Direk (Silindir)
    const poleGeo = new THREE.CylinderGeometry(INNER_R, INNER_R, 300, 32);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x18152e, roughness: 0.3, metalness: 0.8 });
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.y = -100;
    pole.receiveShadow = true;
    towerGroup.add(pole);

    // Top Model
    const ballGeo = new THREE.SphereGeometry(0.75, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({
      color: 0xffe14d,
      roughness: 0.15,
      metalness: 0.4,
      emissive: 0x332a00
    });
    ball = new THREE.Mesh(ballGeo, ballMat);
    ball.castShadow = true;
    ball.position.set(0, 0, (INNER_R + OUTER_R) / 2);
    scene.add(ball);

    // Topun Kendi Işığı (Glow Hissiyatı)
    ballLight = new THREE.PointLight(0xffe14d, 1.2, 12);
    scene.add(ballLight);

    window.addEventListener("resize", onWindowResize);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // Extruded 3D Dilim Geometrisi Üretimi
  function createSectorGeometry(startAngle, angleLength, depth = 0.4) {
    const shape = new THREE.Shape();
    const endAngle = startAngle + angleLength;
    shape.absarc(0, 0, OUTER_R, startAngle, endAngle, false);
    shape.absarc(0, 0, INNER_R, endAngle, startAngle, true);
    shape.closePath();

    const extrudeSettings = {
      depth: depth,
      bevelEnabled: true,
      bevelSegments: 2,
      steps: 1,
      bevelSize: 0.12,
      bevelThickness: 0.12
    };
    const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    geom.rotateX(Math.PI / 2);
    return geom;
  }

  // Kat Oluşturma
  function createFloor(index) {
    const floorGroup = new THREE.Group();
    const floorY = -index * FLOOR_GAP;
    floorGroup.position.y = floorY;

    const angleStep = (Math.PI * 2) / SECTORS;
    const types = new Array(SECTORS).fill("safe");

    // Boşluklar ve Kırmızı Tuzaklar
    const gapCount = index === 0 ? 2 : Math.min(3, 1 + Math.floor(Math.random() * 2));
    const trapCount = index === 0 ? 0 : Math.min(3, Math.floor(Math.random() * (index > 5 ? 3 : 2)));

    let g = 0;
    while (g < gapCount) {
      let idx = Math.floor(Math.random() * SECTORS);
      if (types[idx] === "safe") { types[idx] = "gap"; g++; }
    }

    let t = 0;
    while (t < trapCount) {
      let idx = Math.floor(Math.random() * SECTORS);
      if (types[idx] === "safe") { types[idx] = "trap"; t++; }
    }

    // Materyaller
    const safeMat = new THREE.MeshStandardMaterial({ color: 0x00d4ff, roughness: 0.25, metalness: 0.2 });
    const trapMat = new THREE.MeshStandardMaterial({ color: 0xff3cac, roughness: 0.2, metalness: 0.5, emissive: 0x440011 });

    for (let i = 0; i < SECTORS; i++) {
      if (types[i] === "gap") continue;

      const startA = i * angleStep;
      const geom = createSectorGeometry(startA, angleStep - 0.03);
      const mesh = new THREE.Mesh(geom, types[i] === "trap" ? trapMat : safeMat);
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      floorGroup.add(mesh);
    }

    towerGroup.add(floorGroup);
    return { group: floorGroup, y: floorY, types, passed: false };
  }

  function initGame() {
    state = "play";
    score = 0;
    ballY = 2;
    ballVy = 0;
    towerGroup.rotation.y = 0;

    // Temizlik
    floors.forEach(f => towerGroup.remove(f.group));
    floors = [];
    particles.forEach(p => scene.remove(p.mesh));
    particles = [];

    // Başlangıç Katları
    for (let i = 0; i < 20; i++) {
      floors.push(createFloor(i));
    }

    scoreEl.textContent = "0";
    overlay.classList.add("hide");
    sound(520, "sine", 0.1, 0.08);
  }

  function spawnSplash(y) {
    const splashGeo = new THREE.CircleGeometry(0.65, 16);
    splashGeo.rotateX(-Math.PI / 2);
    const splashMat = new THREE.MeshBasicMaterial({ color: 0xffe14d, transparent: true, opacity: 0.8 });
    const splash = new THREE.Mesh(splashGeo, splashMat);
    splash.position.set(0, y + 0.21, (INNER_R + OUTER_R) / 2);
    towerGroup.add(splash);
  }

   function die() {
    state = "dead";
    sound(110, "sawtooth", 0.35, 0.1);

    // Kırılma Parçacıkları
    for (let i = 0; i < 25; i++) {
      const pGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
      const pMat = new THREE.MeshBasicMaterial({ color: 0xff3cac });
      const pMesh = new THREE.Mesh(pGeo, pMat);
      pMesh.position.copy(ball.position);
      scene.add(pMesh);
      particles.push({
        mesh: pMesh,
        vx: (Math.random() - 0.5) * 0.4,
        vy: Math.random() * 0.4,
        vz: (Math.random() - 0.5) * 0.4,
        life: 1.0
      });
    }

    if (score > best) {
      best = score;
      try { localStorage.setItem(SAVE_KEY, String(best)); } catch (e) {}
    }
    bestEl.textContent = "REKOR: " + best;

    overlay.innerHTML = `<h1>OYUN BİTTİ</h1><p class='sub'>Skor: ${score}${score >= best && score > 0 ? "<br>Yeni Rekor!" : ""}</p><button id='go2'>TEKRAR DENE</button>`;
    overlay.classList.remove("hide");
    document.getElementById("go2").onclick = initGame;
  }

  function update() {
    // Parçacık Fiziği
    particles.forEach(p => {
      p.mesh.position.x += p.vx;
      p.mesh.position.y += p.vy;
      p.mesh.position.z += p.vz;
      p.vy -= 0.015;
      p.life -= 0.025;
      p.mesh.scale.setScalar(Math.max(0.01, p.life));
    });
    particles = particles.filter(p => {
      if (p.life <= 0) { scene.remove(p.mesh); return false; }
      return true;
    });

    if (state !== "play") return;

    // Yerçekimi ve Top Hareketi
    ballVy -= 0.018;
    ballY += ballVy;

    // Kamera Takibi
    const targetCamY = ballY + 7;
    camera.position.y += (targetCamY - camera.position.y) * 0.15;
    camera.position.x = 0;
    camera.position.z = 18;
    camera.lookAt(0, ballY - 1.5, 0);

    ball.position.y = ballY;
    ballLight.position.set(ball.position.x, ball.position.y + 0.5, ball.position.z);

    // Çarpışma Kontrolü
    floors.forEach(f => {
      const topY = f.y + 0.2;
      
      // Katın Üst Yüzeyine Temas
      if (ballY - 0.75 <= topY && ballY - ballVy - 0.75 >= topY - 0.5) {
        // Topun kuleye göre mevcut açısı
        let angle = (-towerGroup.rotation.y % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
        let segIdx = Math.floor(angle / ((Math.PI * 2) / SECTORS)) % SECTORS;
        let type = f.types[segIdx];

        if (type === "safe") {
          ballY = topY + 0.75;
          ballVy = 0.38; // Zıplama
          spawnSplash(f.y);
          sound(480, "sine", 0.05, 0.06);
        } else if (type === "trap") {
          die();
        }
      }

      // Katı Tamamen Geçme (Skor)
      if (!f.passed && ballY < f.y - 1) {
        f.passed = true;
        score++;
        scoreEl.textContent = String(score);
        sound(780, "triangle", 0.07, 0.06);
      }
    });

    // Yeni Kat Ekleme
    if (floors[floors.length - 1].y > ballY - 80) {
      floors.push(createFloor(floors.length));
    }
  }

  function render() {
    update();
    if (renderer && scene && camera) {
      renderer.render(scene, camera);
    }
    requestAnimationFrame(render);
  }

  // Kontroller (Sürükleme ve Klavye)
  function rotateTower(dx) {
    if (state === "play" && towerGroup) {
      towerGroup.rotation.y += dx * 0.0075;
    }
  }

  window.addEventListener("pointerdown", e => { isDragging = true; lastX = e.clientX; });
  window.addEventListener("pointermove", e => {
    if (isDragging) {
      rotateTower(e.clientX - lastX);
      lastX = e.clientX;
    }
  });
  window.addEventListener("pointerup", () => isDragging = false);

  window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") rotateTower(-22);
    if (e.key === "ArrowRight") rotateTower(22);
  });

  goBtn.onclick = () => {
    if (!scene) init3D();
    initGame();
  };

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
